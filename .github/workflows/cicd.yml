name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runs_on:
        required: true
        type: choice
        default: 'self-hosted'
        options:
          - 'self-hosted'
          - 'ubuntu-latest'
        description: 'Runner'

jobs:
  test:
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install Java JDK
        uses: actions/setup-java@v6.3.0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # PluginVersion stays `_PLACEHOLDER_` here: the tests do not depend on it.
      - name: test
        run: ./gradlew test

      # Gradle reports success when it finds no tests, so a broken test setup
      # would otherwise give a green build that ran nothing.
      - name: assert tests actually ran
        shell: bash
        run: |
          shopt -s nullglob
          reports=(build/test-results/test/TEST-*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No JUnit reports produced - the test run did not happen."
            exit 1
          fi
          total=$(grep -ho '<testsuite [^>]*tests="[0-9]*"' "${reports[@]}" | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{ s += $1 } END { print s + 0 }')
          echo "suites=${#reports[@]} tests=$total"
          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::No tests were executed."
            exit 1
          fi

      - name: publish test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: build/test-results/test/*.xml
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set version number
        id: version
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          DAY=$(date +'%d')
          REV=$(printf "%02d" ${{ github.run_number }})
          VERSION="$YEAR.$MONTH.$DAY$REV"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: update version (gradle & plugin.xml)
        shell: bash
        run: ./update-version.sh ${{ env.VERSION }}

      - name: install Java JDK
        uses: actions/setup-java@v6.3.0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: build
        run: ./gradlew buildPlugin -PPluginVersion=${{ env.VERSION }}

      # buildPlugin produces tempo-<version>.zip holding tempo/lib/*.jar (plugin.xml and
      # pluginIcon.svg live inside the main jar). upload-artifact zips whatever it is given,
      # so uploading that zip would nest it in a second zip. Extract it instead: the
      # downloaded artifact is then the plugin itself, ready for "Install Plugin from Disk".
      - name: setup plugin
        shell: bash
        run: |
          distribution="build/distributions/tempo-${{ env.VERSION }}.zip"
          if [ ! -f "$distribution" ]; then
            echo "::error::Plugin distribution not found at $distribution"
            ls -la build/distributions || true
            exit 1
          fi
          rm -rf publish
          mkdir -p publish
          unzip -q "$distribution" -d publish
          jar="publish/tempo/lib/tempo-${{ env.VERSION }}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Plugin jar not found at $jar"
            exit 1
          fi
          unzip -l "$jar" | grep -q 'META-INF/plugin.xml' || { echo "::error::plugin.xml missing from $jar"; exit 1; }
          unzip -p "$jar" META-INF/plugin.xml | grep -q "<version>${{ env.VERSION }}</version>" || { echo "::error::plugin.xml was not stamped with ${{ env.VERSION }}"; exit 1; }
          find publish -type f

      - name: publish plugin
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tempo.${{ env.VERSION }}
          path: publish
          if-no-files-found: error
