# Any property can be overwritten from command-line via
#   -P<propertyName>=<value>

PluginVersion=_PLACEHOLDER_

PublishToken="_PLACEHOLDER_"

# The IDE the plugin is compiled and run against (`runIde`). The plugin only depends on the
# IntelliJ Platform, so any JetBrains IDE works; Rider is used because it is the primary target.
#   Release:  2026.2
#   EAP:      2026.3-EAP2-SNAPSHOT
ProductVersion=2026.2

# The oldest IDE build the plugin declares compatibility with (262 = 2026.2). Building against
# 2026.2 compiles to Java 25 bytecode, and 2026.2 is the first IntelliJ Platform on Java 25:
# an older since-build would let IDEs on Java 21 install the plugin and then fail to load it.
PluginSinceBuild=262

# The IDE bundles its own Kotlin standard library; the plugin must not ship another one.
# https://plugins.jetbrains.com/docs/intellij/using-kotlin.html#kotlin-standard-library
kotlin.stdlib.default.dependency=false

# Required to download Rider artifacts from Maven (and not "binary" releases from CDN).
org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false
